name: Windows Build & Release

# Builds the Windows app (Tauri v2, in BlitztextWin/).
# - On pull requests (touching the Windows app or shared/) and pushes to main:
#   build and upload the installers as a downloadable run artifact.
# - On a push to main: additionally publish a rolling prerelease (tag
#   win-v0.1.<run>) so there is always a current downloadable build.
# - On a version tag (v*): attach the Windows installers to the GitHub Release
#   (shared with the macOS build for the same tag).

on:
  pull_request:
    paths:
      - 'BlitztextWin/**'
      - 'shared/**'
      - '.github/workflows/windows-release.yml'
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # required to publish a Release on tag/main pushes
    defaults:
      run:
        working-directory: BlitztextWin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BlitztextWin/package-lock.json

      - name: Verify versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: ${{ github.workspace }}
        run: bash Scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: BlitztextWin/src-tauri

      - name: Install dependencies
        run: npm ci

      # Mit createUpdaterArtifacts bricht der Bundler ohne privaten Schluessel
      # ab, und zwar sowohl bei leerer als auch bei fehlender Variable
      # ("A public key has been found, but no private key"). Solange das Secret
      # nicht existiert, muss der Build also ohne Update-Artefakte laufen,
      # sonst ist der Job ab dem Merge dauerhaft rot.
      - name: Check updater signing key
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Auf einem Versions-Tag muss die Signatur da sein: ein Release ohne
          # sie ist fuer den Updater wertlos.
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt. Ohne Signatur ist dieses Release fuer den Updater unbrauchbar."
            exit 1
          fi
          echo "::notice::Secret TAURI_SIGNING_PRIVATE_KEY fehlt, dieser Build entsteht ohne Update-Artefakte. Sie entstehen, sobald der Schluessel hinterlegt ist."
          echo "updater=false" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app (Release)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.updater }}" = "true" ]; then
            npm run tauri build
          else
            npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # Gather the NSIS + MSI installers into a single folder at the repo root
      # (artifact/release paths are relative to the workspace, not this job's
      # working-directory).
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-installers"
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "$GITHUB_WORKSPACE/dist-installers/" 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi "$GITHUB_WORKSPACE/dist-installers/" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/dist-installers"

      - name: Build updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/make-updater-manifest.mjs "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/dist-installers/latest.json"

      - name: Validate updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          jq -e '
            (.version | type) == "string" and (.version | length) > 0
            and (.platforms["windows-x86_64"].signature | type) == "string"
            and (.platforms["windows-x86_64"].signature | length) > 0
            and (.platforms["windows-x86_64"].url | type) == "string"
            and (.platforms["windows-x86_64"].url | startswith("https://github.com/"))
          ' dist-installers/latest.json > /dev/null
          echo "Manifest ist vollstaendig."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blitztext-windows
          path: dist-installers/*
          if-no-files-found: error

      # One combined prerelease per commit: same SHA-derived tag as the macOS
      # job, so both apps' artifacts land on a single release. Whichever job
      # runs first creates it; the other just uploads its installers.
      - name: Publish prerelease (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="main-${GITHUB_SHA:0:7}"
          gh release create "$TAG" \
            dist-installers/* \
            --title "Blitztext main build (${GITHUB_SHA:0:7})" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Automatic build from main (commit ${GITHUB_SHA:0:7}). Windows: unsigned NSIS/MSI — SmartScreen may warn on first launch. macOS: universal, ad-hoc signed (not notarized)." \
          || gh release upload "$TAG" dist-installers/* --clobber

      # Version tag (e.g. v1.0.0): attach the Windows installers to the release.
      # The macOS job may have created the release already, so fall back to
      # uploading into the existing release.
      - name: Publish release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-installers/* \
            --title "Blitztext $GITHUB_REF_NAME" \
            --notes "Windows installers (NSIS .exe / MSI), unsigned. SmartScreen may warn on first launch." \
          || gh release upload "$GITHUB_REF_NAME" dist-installers/* --clobber

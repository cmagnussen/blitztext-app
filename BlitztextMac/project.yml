name: BlitztextMac
options:
  bundleIdPrefix: app.blitztext
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ONLY_ACTIVE_ARCH: NO
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "15"

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 0.18.0

targets:
  BlitztextMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Features
      - path: Services
      - path: Views
      - path: Resources
        buildPhase: resources
        excludes:
          - AppIcon.icns
          - Info.plist
          - BlitztextMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blitztext.mac
        PRODUCT_NAME: Blitztext
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CODE_SIGN_ENTITLEMENTS: Resources/BlitztextMac.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    entitlements:
      path: Resources/BlitztextMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    scheme:
      testTargets:
        - BlitztextMacTests

  BlitztextMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Services/DictationSettings.swift
      - path: Services/VaultInboxDocument.swift
      - path: Services/VaultInboxService.swift
      - path: Services/DictationQueueStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blitztext.mac.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ONLY_ACTIVE_ARCH: YES

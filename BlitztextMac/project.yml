name: BlitztextMac
options:
  bundleIdPrefix: app.blitztext
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ONLY_ACTIVE_ARCH: NO
    MARKETING_VERSION: "1.15.1"
    CURRENT_PROJECT_VERSION: "42"
    # In-app updates for installs outside Jamf (Sparkle). The feed is the appcast of the
    # latest public GitHub release; the key is the public half of the signing key.
    SPARKLE_FEED_URL: "https://github.com/cmagnussen/blitztext-app/releases/latest/download/appcast.xml"
    # Name in Finder and the Dock; a design preview builds as "Blitztext Vorschau".
    APP_DISPLAY_NAME: Blitztext
    SPARKLE_PUBLIC_ED_KEY: "E3+VuN7OgR+preZ8H1a73gmDhNDeqvznjUxxpO8kzMM="

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.8.1
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 0.18.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.17.4
  # Local language models (MLX, Apple Silicon only). mlx-swift and swift-transformers
  # are pinned to the versions mlx-swift-lm and WhisperKit already resolve, so they add
  # no second copy; they are listed to import MLX (memory limits) and Tokenizers.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.1.9

targets:
  BlitztextMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Features
      - path: Services
      - path: Views
      # Shared with the iOS app: AI providers, on-device rewriting, mode prompts.
      - path: ../BlitztextShared
      - path: Resources
        buildPhase: resources
        excludes:
          - AppIcon.icns
          - Info.plist
          - BlitztextMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blitztext.mac
        PRODUCT_NAME: Blitztext
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CODE_SIGN_ENTITLEMENTS: Resources/BlitztextMac.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_SUFeedURL: $(SPARKLE_FEED_URL)
        INFOPLIST_KEY_SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        INFOPLIST_KEY_SUEnableAutomaticChecks: YES
    dependencies:
      - package: Sparkle
      - package: ArgmaxOSS
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwift
        product: MLX
      - package: SwiftTransformers
        product: Tokenizers
    scheme:
      testTargets:
        - BlitztextMacTests
    entitlements:
      path: Resources/BlitztextMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true

  BlitztextMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # Pure logic is compiled directly into the test bundle, so tests need no host app.
      - path: Services/TranscriptPostProcessor.swift
      - path: Services/InsertionFitter.swift
      - path: Services/WebsiteHost.swift
      - path: Services/TranscriptParagraphService.swift
      - path: Services/ClipboardPasteService.swift
      - path: ../BlitztextShared/Transcription/HallucinationFilter.swift
      - path: ../BlitztextShared/Transcription/SpokenEmailAddress.swift
      - path: Services/ShortcutModifiers.swift
      - path: ../BlitztextShared/AI/InventedDeadlineFilter.swift
      - path: ../BlitztextShared/Meeting/SpeakerAlignment.swift
      - path: ../BlitztextShared/Meeting/EchoFilter.swift
      - path: Services/LocalLanguageModel/LocalModelCatalog.swift
      - path: Services/AudioPadding.swift
      - path: ../BlitztextShared/Meeting/SpeakerAlignment.swift
      - path: Features/Meeting/WAVRecovery.swift
      - path: Services/LocalLanguageModel/GemmaChatFormat.swift
      - path: Features/Meeting/TextParts.swift
      - path: Services/FocusedFieldReader.swift
      - path: ../BlitztextShared/Meeting/ListDisplay.swift
      - path: Features/Workflows/WorkflowPhase.swift
      - path: Features/Workflows/DictationRun.swift
      - path: Services/TranscriptionQualityService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.blitztext.mac.tests
        GENERATE_INFOPLIST_FILE: YES
